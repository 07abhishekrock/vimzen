<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Form Lab</title>
<style>
  body { font: 15px/1.6 system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 20px; color: #222; }
  .lab { background: #eef6ff; border: 1px solid #bcd7f5; border-radius: 6px; padding: 12px 16px; font-family: monospace; font-size: 13px; }
  label { display: block; margin: 14px 0 4px; font-weight: 600; }
  input[type=text], textarea, select { width: 100%; padding: 8px; border: 1px solid #bbb; border-radius: 4px; font: inherit; }
  button { margin-top: 14px; padding: 8px 16px; }
  #done { color: green; font-weight: 600; }
</style>
</head>
<body>
<div class="lab">
  <b>form lab</b> — auto-insert experiment. From NORMAL, click straight onto a field:
  the overlay should drop you into INSERT <i>with the field focused</i>.
  <code>Esc</code> (or <code>C-[</code>) returns to NORMAL and blurs the field.
</div>
<p><a href="scroll.html">→ scroll lab</a> · <a href="media.html">→ media lab</a></p>

<form id="f">
  <label for="name">name</label>
  <input id="name" type="text" placeholder="click me from NORMAL mode">

  <label for="bio">bio</label>
  <textarea id="bio" rows="4" placeholder="multi-line editing"></textarea>

  <label for="country">country</label>
  <select id="country">
    <option>india</option><option>germany</option><option>japan</option><option>brazil</option>
  </select>

  <label><input type="checkbox" style="width:auto"> subscribe to the newsletter</label>

  <button>submit</button> <span id="done"></span>
</form>
<script>
document.getElementById('f').addEventListener('submit', (e) => {
  e.preventDefault();
  document.getElementById('done').textContent = 'submitted (demo)';
});
</script>
</body>
</html>
